POKY_BBLAYERS_CONF_VERSION = "2"

BBPATH = "${TOPDIR}"
BBFILES ?= ""

BBLAYERS ?= " \
  ${TOPDIR}/../layers/openembedded-core/meta \
  ${TOPDIR}/../layers/meta-yocto/meta-poky \
  ${TOPDIR}/../layers/meta-yocto/meta-yocto-bsp \
  ${TOPDIR}/../layers/meta-openembedded/meta-oe \
  ${TOPDIR}/../layers/meta-openembedded/meta-python \
  ${TOPDIR}/../layers/meta-openembedded/meta-networking \
  ${TOPDIR}/../layers/meta-openembedded/meta-filesystems \
  ${TOPDIR}/../layers/meta-openembedded/meta-multimedia \
  \
  ${TOPDIR}/../layers/meta-rauc \
  \
  ${TOPDIR}/../layers/meta-arm/meta-arm \
  ${TOPDIR}/../layers/meta-arm/meta-arm-toolchain \
  \
  ${TOPDIR}/../layers/meta-raspberrypi \
  \
  ${TOPDIR}/../layers/meta-xilinx/meta-xilinx-core \
  ${TOPDIR}/../layers/meta-xilinx/meta-xilinx-standalone \
  \
  ${TOPDIR}/../layers/meta-schneios \
  \
  "
